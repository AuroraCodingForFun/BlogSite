<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <nav>
        <a class="brand" href="{{ '/' | relative_url }}">Aurora Coding for Fun</a>
        <a href="{{ '/' | relative_url }}">Home</a>
      </nav>

      <div class="hero">
        <h1>{{ page.title }}</h1>
        {% if page.image %}
          <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
        {% endif %}
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      &copy; {{ site.time | date: "%Y" }} Aurora
    </footer>
  </body>
</html>
