<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
    <link rel="icon" href="{{ page.favicon | default: '/images/favicons/favicon.png' | relative_url }}">

<style>
:root { --paper: {{ page.paper | default: '#630000' }}; }

.card {
        background-color: white;
        color: #2b0a0a;
        padding: 16px 25px 30px 50px;
        border-radius: 25px;
        margin-bottom: 1.5rem;
      }
.layout {
  display: block;
} 
.indice {
  flex: 1;
  min-width: 0;
  background-color: white;
  padding: 16px 25px 30px 25px;
  border-radius: 25px;
}
aside.laterale {
  position: fixed;
  top: 10px;
  right: 16px;
  box-sizing: border-box;
  width: 260px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  padding: 10px 10px 10px 10px;
  background-color: var(--sun);
  border-radius: 25px;
  font-style: italic;
  z-index: 10;
}

  @media (max-width: 1100px) {
  aside.laterale {
    position: static;
    width: auto;
    max-height: none;
    margin-top: 24px;
  }
}
</style>
  </head>
 <body style="{% if page.color1 %}--sky: {{ page.color1 }};{% endif %}{% if page.color2 %}--ink: {{ page.color2 }};{% endif %}{% if page.color3 %}--sun: {{ page.color3 }};{% endif %}{% if page.button %}--button: {{ page.button }};{% endif %}">    <header class="site-header">
      <nav>
        <a class="brand" href="https://github.com/AuroraCodingForFun"> </> Aurora Coding for Fun</a>
        <a href="{{ '/' | relative_url }}"> 🏠︎ Home</a>
      </nav>

      <div class="hero">
        <aside class="laterale">
              <h2> "More content:"</h2>
             {% for post in site.posts %}
                 <a href="{{ post.url | relative_url }}" style="text-decoration: none; display: block;">
                  <li class="button" style="background-color: {% if post.url == page.url %}var(--sky){% else %}#edfcff{% endif %}">
                   <div style="display: flex; align-items: center; justify-content: space-between;">
                     <span>
                       <b style="color: var(--ink)">{{ post.title }}</b>
                       <small style="color: var(--ink)">({{ post.date | date: "%d/%m/%Y" }})</small>
                     </span>
                   </div>
                 </li>
               </a>
             {% endfor %}
        </aside>
        <h1>{{ page.title }}</h1>
        {% if page.image %}
          <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
        {% endif %}
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      &copy; 📆 {{ site.time | date: "%Y" }} AuroraCodingForFun
    </footer>
  </body>
</html>
