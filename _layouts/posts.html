<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
    <link rel="icon" href="{{ page.favicon | default: '/images/favicons/favicon.png' | relative_url }}">

<style>
:root { --paper: {{ page.paper | default: '#630000' }}; }

.card {
        background-color: white;
        color: #2b0a0a;
        padding: 16px 25px 30px 50px;
        border-radius: 25px;
        margin-bottom: 1.5rem;
      }
.layout {
  display: block;
} 
.indice {
  flex: 1;
  min-width: 0;
  background-color: white;
  padding: 16px 25px 30px 25px;
  border-radius: 25px;
}
aside.laterale {
  position: fixed;
  top: 10px;
  right: 16px;
  box-sizing: border-box;
  width: 260px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  padding: 10px 10px 10px 10px;
  background-color: var(--sun);
  border-radius: 25px;
  z-index: 10;
}
.laterale ul {
  display: none;
  list-style: none;
  margin: 0;
  padding: 0;
}
.laterale.open ul {
  display: block;
}
.laterale-toggle {
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 700;
  color: inherit;
  padding: 8px 0;
  width: 100%;
  text-align: left;
}
  @media (max-width: 1100px) {
  aside.laterale {
    position: static;
    width: auto;
    max-height: none;
    margin-top: 24px;
  }
}
</style>
  </head>
 <body style="{% if page.color1 %}--sky: {{ page.color1 }};{% endif %}{% if page.color2 %}--ink: {{ page.color2 }};{% endif %}{% if page.color3 %}--sun: {{ page.color3 }};{% endif %}{% if page.button %}--button: {{ page.button }};{% endif %}">    <header class="site-header">
      <nav>
        <a class="brand" href="https://github.com/AuroraCodingForFun"> </> Aurora Coding for Fun</a>
        <a href="{{ '/' | relative_url }}"> 🏠︎ Home</a>
      </nav>

      <div class="hero">
        <aside class="laterale" id="laterale">
          <button class="laterale-toggle" onclick="toggleLaterale(this)">
            <span class="arrow">☰</span> More content
          </button>
          <ul>
            {% for post in site.posts %}
              <li style="margin-bottom: 8px; width: 100%; box-sizing: border-box;">
                <a href="{{ post.url | relative_url }}" style="text-decoration: none; display: block; width: 100%; box-sizing: border-box;">
                  <div class="button" style="background-color: {% if post.url == page.url %}var(--sky){% else %}#edfcff{% endif %}; display: flex; align-items: center; justify-content: flex-start; padding: 8px 12px; border-radius: 25px; width: 100%; box-sizing: border-box; height: 48px; overflow: hidden;">
  <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">
    <b style="color: var(--ink)">{{ post.title }}</b>
  </span>
</div>
                </a>
              </li>
            {% endfor %}
          </ul>
        </aside>
        <h1>{{ page.title }}</h1>
        {% if page.image %}
          <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
        {% endif %}
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      &copy; 📆 {{ site.time | date: "%Y" }} AuroraCodingForFun
    </footer>
    <script>
    function toggleLaterale(btn) {
      var aside = document.getElementById('laterale');
      var arrow = btn.querySelector('.arrow');
      aside.classList.toggle('open');
      arrow.textContent = aside.classList.contains('open') ? '🗗' : '☰';
    }
    </script>
  </body>
</html>
