<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pacman WebAssembly</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; padding: 20px; }
        #output { width: 100%; height: 300px; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Pacman C++ in WebAssembly</h2>
    <p>Usa i tasti W, A, S, D o le frecce direzionali (assicurati di cliccare qui dentro):</p>
    <textarea id="output" readonly></textarea>

    <script>
        // Reindirizza il cout di C++ nella textarea della pagina
        var Module = {
            print: function(text) {
                var textarea = document.getElementById('output');
                if (textarea) {
                    textarea.value += text + "\n";
                    textarea.scrollTop = textarea.scrollHeight;
                }
            },
            printErr: function(text) {
                console.error(text);
            }
        };
    </script>
    <!-- Carica lo script generato da Emscripten -->
    <script src="pacman.js"></script>
</body>
</html>
